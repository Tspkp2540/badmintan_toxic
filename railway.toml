[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
numReplicas = 1
startCommand = "./badminton-server"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[volumes]]
mountPath = "/app/data"
name = "badminton-db"
