services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=change-this-secret-in-production
      - DB_PATH=/app/data/badminton.db
    volumes:
      - badminton-data:/app/data
    restart: unless-stopped

volumes:
  badminton-data:
